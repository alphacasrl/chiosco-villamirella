<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- niente zoom di pagina: sul chiosco lo zoom lo fa solo la mappa, coi pulsanti -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Villamirella — Palinuro e il Cilento</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=202608121254">
</head>
<body>

<!-- ============ SCHERMATA INIZIALE (stile guida cartacea) ============ -->
<div id="home" aria-hidden="false">
  <div id="home-interno">
    <img id="home-logo" src="assets/logo-villamirella.svg" alt="Villamirella">
    <h1 id="home-titolo"></h1>
    <p id="home-sotto"></p>
    <div id="mattonelle"></div>
    <p id="home-invito">Tocca un riquadro per cominciare</p>
  </div>
</div>

<!-- ================= PAGINA INFORMATIVA (dalla guida) ================= -->
<div id="pagina" aria-hidden="true">
  <header id="pagina-testata">
    <button class="bt chiaro" id="pagina-home" type="button">‹ Tutte le sezioni</button>
    <h2 id="pagina-titolo"></h2>
    <button class="bt" id="pagina-esplora" type="button">Mappa e luoghi</button>
  </header>
  <div id="pagina-corpo"></div>
</div>

<div id="app">

  <!-- ============================ SINISTRA ============================ -->
  <section id="pannello">

    <header id="testata">
      <img src="assets/logo-villamirella.svg" alt="Villamirella">
      <div class="scritte">
        <h1>Palinuro e il Cilento</h1>
        <p>Guida del Residence Villamirella</p>
      </div>
      <button id="reset" type="button" aria-label="Ricomincia dall'inizio">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/>
        </svg>
        <span>Ricomincia</span>
      </button>
    </header>

    <button id="riapri-mappa" type="button">Mostra la mappa ›</button>

    <div id="barra-sezione">
      <button id="sez-home" type="button">‹ Tutte le sezioni</button>
      <b id="sez-nome"></b>
    </div>

    <div id="elenco"></div>

    <!-- scheda di dettaglio: scorre sopra l'elenco, non apre pagine esterne -->
    <article id="dettaglio" aria-hidden="true">
      <div class="scorri">
        <div class="copertina-cornice">
          <img class="copertina" id="det-foto" alt="">
        </div>
        <div class="testo">
          <div class="categoria" id="det-categoria"></div>
          <h2 id="det-nome"></h2>
          <div id="det-prenotabile"></div>
          <p class="sommario" id="det-sommario"></p>
          <div class="righe" id="det-righe"></div>
          <div id="det-articoli"></div>
        </div>
      </div>
      <div class="piede">
        <button class="bt chiaro largo" id="det-indietro" type="button">‹ Torna all'elenco</button>
        <button class="bt largo" id="det-mappa" type="button">Vedi sulla mappa</button>
      </div>
    </article>

  </section>

  <!-- =========================== DIVISORIO =========================== -->
  <div id="divisorio" role="separator" aria-label="Sposta la divisione">
    <button class="freccia" id="verso-sinistra" type="button" aria-label="Mappa a tutto schermo">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <em>mappa<br>intera</em>
    </button>
    <div class="presa"></div>
    <button class="freccia" id="verso-destra" type="button" aria-label="Elenco a tutto schermo">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 6l6 6-6 6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>
      <em>elenco<br>intero</em>
    </button>
  </div>

  <!-- ============================= DESTRA ============================= -->
  <section id="mappa-lato">
    <div id="mappa"></div>

    <button id="panoramica" type="button">Torna alla panoramica</button>
    <!-- ripristino quando l'elenco e' a tutto schermo -->
    <button id="riapri-elenco" type="button">› Mostra l'elenco</button>

    <div id="comandi">
      <button class="cmd grande" id="cmd-base" type="button">Mappa</button>
      <button class="cmd grande" id="cmd-3d" type="button">Rilievo 3D</button>
      <button class="cmd grande" id="cmd-vista" type="button">Vista dall'alto</button>
      <div class="gruppo">
        <button class="cmd" id="cmd-piu" type="button" aria-label="Ingrandisci">+</button>
        <button class="cmd" id="cmd-meno" type="button" aria-label="Rimpicciolisci">−</button>
      </div>
      <!-- bussola: si trascina per ruotare, un tocco rimette il nord -->
      <div id="bussola" role="slider" aria-label="Rotazione della mappa" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
        <div id="bussola-disco">
          <div class="tacca nord">N</div>
          <div class="tacca est">E</div>
          <div class="tacca sud">S</div>
          <div class="tacca ovest">O</div>
          <div id="bussola-ago"></div>
        </div>
      </div>
      <button class="cmd" id="cmd-casa" type="button" aria-label="Vai al residence">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4l8 7h-2.4v8h-4v-5h-3.2v5h-4v-8H4z" fill="currentColor"/></svg>
      </button>
    </div>

    <div id="avviso" role="status"></div>
  </section>

</div>

<script src="guida.js?v=202608121254"></script>
<script src="poi.js?v=202608121254"></script>
<script src="parco.js?v=202608121254"></script>
<script src="percorsi.js?v=202608121254"></script>
<script src="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.js"></script>
<script src="app.js?v=202608121254"></script>
</body>
</html>
